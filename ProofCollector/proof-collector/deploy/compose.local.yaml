# Local, private, hardened. Loopback publication ONLY. Run `./proofctl init` on the host first.
services:
  collector:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: proof-collector:m1
    container_name: proof-collector-local
    environment:
      MODE: local
      EVIDENCE_MODE: full
      CONFIG_DIR: /config
      STATE_DIR: /state
    ports:
      - "127.0.0.1:8888:8888"      # NEVER "8888:8888" — loopback binding is what keeps it private
    volumes:
      - ../.pcrun:/config:ro        # runtime material generated by `./proofctl init`
    tmpfs:
      - /tmp
      - /state                      # ephemeral state (disposable); the container is the reset boundary
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8888/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
