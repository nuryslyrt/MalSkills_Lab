    next_review_required_on: "registry.yaml:modified OR skill_inventory:changed"
    owner: surgeon
    risk_tier: critical

  - id: tool_contract_soundness
    statement: >
      Every producer/consumer contract chain has matching required fields
      with compatible types. No downstream skill declares an input that no
      upstream skill produces.
    validation_method: policy-as-code
    status: checked
    evidence:
      - type: contract_chain_check
        source: "**/contract.yaml"
        captured_at: 2026-08-01T00:00:05.000Z
        checker: contract-compat-checker
        result_summary: >
          Chain review -> report compatible: report.input.required {findings, structure_overview}
          both satisfied by review.output.required {findings(array), structure_overview(string)},
          types match. Worker source-reader-worker output {files, structure_overview} satisfies
          review-expert. Orchestrator output {report_path, summary} satisfied by orchestrator-level
          aggregation (report-expert -> report_path; summary carried from review-expert). 1 advisory:
          review-expert produces 'files_reviewed' unused downstream.
        detail:
          field_mapping:
            "review-expert -> report-expert":
              findings: "findings -> findings (array -> array, compatible)"
              structure_overview: "structure_overview -> structure_overview (string -> string, compatible)"
              files_reviewed: "files_reviewed -> (not consumed, advisory)"
    exceptions:
      - id: unused_field_review_expert_files_reviewed
        severity: advisory
        description: "review-expert produces 'files_reviewed' but no downstream expert consumes it."
        recommended_action: "Leave as-is (over-producing is safe), or have report-expert reference files_reviewed for an appendix, or drop from the contract."
        related_evidence: [contract_chain_check]
    renewal_trigger: >
      Any contract.yaml modified, or new skill added with a new contract.
    next_review_required_on: "**/contract.yaml:modified"
    owner: surgeon
    risk_tier: high

  - id: workflow_termination
    statement: >
      The job dependency graph is a directed acyclic graph. Execution always
      terminates in a bounded number of batches; no cycles or dangling
      references exist.
    validation_method: proof
    status: proven
    evidence:
      - type: dag_snapshot
        source: registry.yaml
        hash: sha256:72851dd2bcb080815b3b16bdf2dc79675f47e2298be2d3bed7abb9b565541726
        captured_at: 2026-08-01T00:00:06.000Z
        checker: dag-validator
        result_summary: >
          2 jobs, 1 dependency edge. review (no deps) -> report (depends on review).
          No cycles, no dangling references, no orphaned jobs. Topologically sorts into
          2 batches: [review], [report]. Longest path: review -> report. is_valid=true.
    exceptions: []
    renewal_trigger: >
      Any dependency edge added, removed, or retargeted. Any change to
      orchestrator routing rules that could affect job chaining.
    next_review_required_on: "registry.yaml:modified OR orchestrator/SKILL.md:routing_changed"
    owner: surgeon
    risk_tier: critical

