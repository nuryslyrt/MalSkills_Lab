  - id: routing_totality
    statement: >
      Every expert listed in the registry has at least one orchestrator
      routing rule that can direct work to it. No ambiguous patterns exist
      where two rules could match the same input. A catch-all or explicit
      fallback exists for unmatched requests.
    validation_method: policy-as-code
    status: checked
    evidence:
      - type: routing_coverage_map
        source: orchestrator/SKILL.md
        hash: sha256:8b774b49bfe12b58c8d3ab5013d75209955a8764b0984d7945ce0bcf92ee03e8
        captured_at: 2026-08-01T00:00:08.000Z
        result_summary: >
          Both registry experts have routing rules. review-expert <- "review|analyze|inspect|quality|audit code|lint";
          report-expert <- "report|write|document|summarize|code-review.md|render findings". Patterns disjoint (no ambiguity).
          Explicit fallback present ("If no routing rule matches, inform the user"). Available Experts table matches
          registry expert list. Available Workers summary present.
        detail:
          routing:
            review-expert: "review|analyze|inspect|quality|audit code|lint"
            report-expert: "report|write|document|summarize|code-review.md|render findings"
          fallback: "explicit: inform user request does not match a configured expert"
    exceptions: []
    renewal_trigger: >
      Orchestrator SKILL.md routing rules modified, or registry experts
      list changes.
    next_review_required_on: "orchestrator/SKILL.md:modified OR registry.yaml:experts_changed"
    owner: doctor
    risk_tier: high

  - id: observability_integrity
    statement: >
      The .orpheus/logs/ directory structure is correct, every recent
      execution has assembled log views (timeline, decisions, errors), and
      no log entry files are corrupted or unreadable.
    validation_method: evidence
    status: attested
    evidence:
      - type: log_inspection
        source: logs/runtime/e001
        captured_at: 2026-08-01T00:00:09.000Z
        checker: log-analyzer
        result_summary: >
          logs/, build/, runtime/ present. Execution e001: all 4 assembled views present
          (timeline.log.yaml, decisions.log.yaml, errors.log.yaml, execution.log.yaml).
          orchestrator/ has 6 structured entry-NNN.yaml. errors.log clean (0 errors/warnings).
          GAPS: jobs/report/ log directory missing (report job left no per-job log dir);
          jobs/review/ contains a non-standard plaintext 'decision.log' instead of structured
          entry-NNN.yaml entries. coverage_score ~0.8.
        detail:
          assembled_views: [timeline.log.yaml, decisions.log.yaml, errors.log.yaml, execution.log.yaml]
          orchestrator_entries: 6
          job_log_dirs_present: [review]
          job_log_dirs_missing: [report]
          nonstandard_job_logs: ["jobs/review/decision.log (plaintext, not entry-NNN.yaml)"]
    exceptions:
      - id: missing_report_job_log_dir
        severity: warning
        description: "Execution e001 has no logs/runtime/e001/jobs/report/ directory; the report job produced no per-job log entries."
        recommended_action: "Investigate why report-expert did not write entry-NNN.yaml to its log_path. Confirm the dispatch supplied log_path and the expert honored its Logging Protocol."
        related_evidence: [log_inspection]
      - id: nonstandard_review_job_log_format
        severity: warning
        description: "jobs/review/ logs to a plaintext 'decision.log' rather than structured entry-NNN.yaml files; assembled decision/timeline views cannot fully incorporate it."
        recommended_action: "Ensure review-expert emits structured entry-NNN.yaml decision entries (question/options_considered/chosen/reasoning/confidence) per its Logging Protocol so the Doctor/Auditor can consume them."
        related_evidence: [log_inspection]
    renewal_trigger: >
      A new execution completes without having assemble-logs.py run, or
      logs directory structure is altered.
    next_review_required_on: "logs/runtime:new_execution_without_assembly"
    owner: doctor
    risk_tier: medium

  - id: configuration_validity
    statement: >
      The system configuration (system.yaml) is well-formed, declares all
      required fields with valid values, and the generated system is
      self-contained — .orpheus/scripts/ directory exists with the four
      runtime scripts (generate-id.py, validate-yaml.py, init-execution.sh,
      assemble-logs.py).
    validation_method: evidence
    status: attested
    evidence:
      - type: config_snapshot
        source: system.yaml
        hash: sha256:4c5ad86acab5852306bdcc3533754a1f0b4a97f467df826e55548535a1b279d0
        captured_at: 2026-08-01T00:00:09.000Z
        result_summary: >
          system.name='code-reviewer' non-empty. orchestrator.strategy=adaptive (valid),
          max_retries=2 (valid non-neg int), timeout_seconds=300 (valid positive),
          escalation=user (valid). logging.level=info (valid); all logging boolean fields
          are booleans. scripts/ present with all 4 runtime scripts.
        detail:
          scripts_present: [assemble-logs.py, generate-id.py, init-execution.sh, validate-yaml.py]
    exceptions: []
    renewal_trigger: >
      system.yaml modified, or scripts/ directory contents change.
    next_review_required_on: "system.yaml:modified OR scripts/:contents_changed"
    owner: doctor
    risk_tier: medium

