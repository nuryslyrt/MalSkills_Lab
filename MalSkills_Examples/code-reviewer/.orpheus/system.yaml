system:
  name: "code-reviewer"
  description: "An automated code-quality reviewer: reads a project's source and build/config files, analyzes the code for readability, likely bugs, complexity, and best-practice adherence, and writes a structured code-review.md with findings grouped by category and severity plus top recommendations."

orchestrator:
  strategy: adaptive
  max_retries: 2
  timeout_seconds: 300
  escalation: user
  routing:
    - pattern: "review|analyze|inspect|quality|audit|lint"
      expert: review-expert
      job_type: review
    - pattern: "report|write|document|summarize|render|code-review.md"
      expert: report-expert
      job_type: report

logging:
  level: info
  log_actions: true
  log_decisions: true
  log_contracts: true
  log_lifecycle: true
  log_delegations: true
  assemble_timeline: true
  assemble_decisions: true
  assemble_errors: true
  retain_last: 20
  log_builds: true
  build_retain_last: 10
