  - path: README.md
    content: "# LiteRT Agent — on-device Gemma-4-with-tools iOS demo & prompt test bench\n\nA universal **iPhone + iPad** SwiftUI app that runs a **single LiteRT-LM model\n(Gemma 4 E2B)** which both chats\
      \ *and* takes device actions via the SDK's native\n**tool calling**. It doubles as a **test bench** for trying prompts, sampling, and\nwhich \"skills\" (tools) the model can call.\n\nEach `DeviceAction`\
      \ is registered as a LiteRT-LM `Tool`. Gemma 4 decides when to\ncall one; the SDK decodes the arguments and invokes `run()`, which routes through\n`ActionRuntime` (confirmation gate) to `ActionExecutor`,\
      \ which uses Apple-permitted\nAPIs (compose SMS/email, dial, Calendar/Reminders, Maps/Directions, open URLs/apps).\n\n```\nYou ⇄ Chat UI ──► Gemma 4 engine (GPU/Metal)  +  registered Tools\n     \
      \                   │ model emits a tool call\n                        ▼\n                  ActionRuntime ── (optional user confirm) ──► ActionExecutor ──► iOS APIs\n```\n\n**Test bench:** the sliders\
      \ button in Chat opens a live editor for the **system\nprompt** and **sampling** (`topK`/`topP`/`temperature`); the **Skills** tab toggles\nwhich tools are registered. \"Apply\" rebuilds the conversation\
      \ without reloading the\nmodel. (Earlier two-model design — Gemma 4 orchestrator + FunctionGemma — is in git\nhistory; collapsed to one model because Gemma 4 calls tools natively and is ungated.)\n\
      \n---\n\n## Status\n\n✅ **Builds, links, installs, launches, and renders** on the iPhone 17 Pro\nsimulator (Xcode 26.5, iOS 26.5 SDK), compiled against the real **LiteRT-LM\nv0.12.0** Swift package.\
      \ The `LiteRTEngine` wrapper, `Tool` definitions, and\n`ConversationConfig(systemMessage:tools:samplerConfig:)` all match v0.12.0.\n**Token generation still needs a real 8 GB device** (the Metal LLM\
      \ path isn't\nmeaningful in the Simulator).\n\n## ⚠️ Read this first (honest constraints)\n\n1. **Inference is unverified.** Build + launch + UI are verified; actually loading\n   Gemma 4 and generating/tool-calling\
      \ needs a physical device with the model downloaded.\n2. **iOS is sandboxed** — an app cannot silently control the device. Each tool\n   either opens a UI you confirm (compose sheet, dial prompt)\
      \ or needs a granted\n   permission. The app's `ActionRuntime` adds an extra confirm-before-acting gate.\n3. **Memory & device requirements are real.** Gemma 4 E2B is ~2.6 GB on disk and\n   ~1.4\
      \ GB GPU working set — run on an **8 GB-RAM device** (iPhone 15 Pro / newer,\n   M-series or 8 GB iPad). The `Increased Memory Limit` entitlement is declared.\n   On smaller devices, pick **Gemma\
      \ 3 1B** in the Models tab.\n4. **No token needed for the default model.** Gemma 4 E2B is **ungated** — downloads\n   with no HuggingFace token. The token field in Settings is only for gated models.\n\
      5. **Run on a physical device.** LiteRT-LM's GPU path uses Metal; the Simulator\n   is unreliable for this and the SDK may ship device-only slices.\n\n---\n\n## Prerequisites\n\n- macOS with **Xcode\
      \ 15+** and an Apple Developer account (free tier is fine for\n  device testing).\n- A physical iPhone/iPad (recommended: 8 GB RAM) on **iOS 17+**.\n- A **HuggingFace account + read token**, with\
      \ the Gemma license accepted on the\n  model pages you intend to use.\n\n## Build\n\n### Option A — XcodeGen (recommended)\n\n```bash\nbrew install xcodegen          # once\ncd /Users/box/Documents/Projects/LiteRTExperiments\n\
      xcodegen generate              # creates LiteRTAgent.xcodeproj from project.yml\nopen LiteRTAgent.xcodeproj\n```\n\nIn Xcode: select your team under **Signing & Capabilities**, add the\n**Increased\
      \ Memory Limit** capability if not auto-added, pick your device, and Run.\n\n#### Two non-obvious gotchas with this package (already handled here)\n\n- **`GIT_LFS_SKIP_SMUDGE=1`** — the LiteRT-LM\
      \ repo is a large Git-LFS repo and at\n  least one Android prebuilt `.so` LFS object is missing from the remote, which\n  makes SwiftPM's checkout fail (`smudge filter lfs failed`). We don't need\
      \ those\n  binaries (the iOS framework comes from the release xcframework). If Xcode fails\n  to resolve the package, launch it from a shell with the var set, or skip smudge\n  globally: `git config\
      \ --global filter.lfs.process \"git-lfs filter-process --skip\"`.\n- **Revision pin instead of version range** — SwiftPM's version/tag resolution\n  chokes on this repo (`Needed a single revision`),\
      \ so `project.yml` pins the\n  package to the **v0.12.0 commit** (`ffed38a…`) rather than `from: \"0.12.0\"`.\n\nCommand-line build that is known to work (Xcode 26.5):\n\n```bash\n# If `xcode-select\
      \ -p` points at CommandLineTools, prefix with DEVELOPER_DIR.\nGIT_LFS_SKIP_SMUDGE=1 \\\nDEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \\\nxcodebuild build -project LiteRTAgent.xcodeproj\
      \ -scheme LiteRTAgent \\\n  -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -derivedDataPath build\n```\n\n### Option B — manual Xcode project\n\n1. New project → **App** (SwiftUI, Swift),\
      \ name `LiteRTAgent`, then delete the\n   generated `ContentView`/`App` files.\n2. Drag the `Sources/` folder in (Create groups).\n3. **File ▸ Add Package Dependencies** → `https://github.com/google-ai-edge/LiteRT-LM`\n\
      \   → \"Up to Next Major\" from `0.12.0`. Add the library product to the target.\n4. Set the target's **Info.plist** to `Sources/App/Info.plist` and **Code Signing\n   Entitlements** to `Sources/App/LiteRTAgent.entitlements`.\n\
      5. Target Membership → iPhone + iPad. Deployment target iOS 17.\n6. Signing & Capabilities → add **Increased Memory Limit**.\n\n## First run\n\n1. **Models tab** → Download **Gemma 4 E2B** (~2.6 GB;\
      \ use Wi-Fi). No token needed.\n   Then tap **Load selected model** (or **Load Agent** on the Chat tab).\n2. **Chat tab** → talk. Try: *\"Text Sam that I'll be 10 minutes late\"*,\n   *\"Add a dentist\
      \ appointment tomorrow at 3pm\"*, *\"Walking directions to the\n   Ferry Building\"*. The model calls the matching tool; you confirm it in a sheet.\n3. **Test bench**: the **sliders button** (top-right\
      \ of Chat) edits the system\n   prompt + sampling; the **Skills tab** toggles which tools are available. Tap\n   **Apply** to rebuild the conversation live without reloading the model.\n\n---\n\n\
      ## SDK reference (verified against LiteRT-LM v0.12.0)\n\nAll SDK use is confined to [`Sources/Engine/LiteRTEngine.swift`](Sources/Engine/LiteRTEngine.swift)\nplus the `Tool` definitions in [`Sources/Actions/ActionTools.swift`](Sources/Actions/ActionTools.swift).\n\
      If you bump the package version, re-check these:\n\n| Symbol | Used as |\n|---|---|\n| `import LiteRTLM` | module name |\n| `EngineConfig(modelPath:backend:maxNumTokens:cacheDir:)`, `Backend.gpu /\
      \ .cpu()` | engine config |\n| `Engine(engineConfig:)`, `try await engine.initialize()` | load |\n| `ConversationConfig(systemMessage:initialMessages:tools:samplerConfig:)` | conversation setup |\n\
      | `try await engine.createConversation(with:)` | start/rebuild chat |\n| `conversation.sendMessageStream(Message(\"…\"))` → `chunk.toString` | streaming |\n| `SamplerConfig(topK:topP:temperature:)`,\
      \ `Message(_:role:.system)` | sampling + system prompt |\n| `Tool` protocol (`name`/`description`/`run()`), `@ToolParam(description:)` | tool calling |\n\n## File tour\n\n```\nproject.yml        \
      \                 XcodeGen spec (declares the SwiftPM dep)\nSources/\n  App/LiteRTAgentApp.swift          @main + AppState (load + live reconfigure)\n  App/Info.plist                    permission\
      \ strings + URL scheme allowlist\n  App/LiteRTAgent.entitlements      Increased Memory Limit\n  Engine/LiteRTEngine.swift         *** the only LiteRT-LM SDK touchpoint ***\n  Models/ModelCatalog.swift\
