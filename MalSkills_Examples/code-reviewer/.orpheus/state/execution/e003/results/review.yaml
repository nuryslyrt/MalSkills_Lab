  - file: Sources/Chat/ChatViewModel.swift
    line: 55
    category: bug
    severity: medium
    description: |
      In `send()`, `assistantIndex` is captured as `messages.count` before the Task block,
      then used inside the Task to index into `messages`. However, the Combine sink on
      ActionRuntime.shared.$history (lines 33-46) can append action messages to `messages`
      concurrently during streaming. If an action bubble is inserted before the assistant
      message position, `assistantIndex` may point to the wrong message, causing the streamed
      text to be appended to an action bubble instead of the assistant bubble, or the index
      check `messages.indices.contains(assistantIndex)` could fail, losing the response.
    suggested_fix: |
      Track the assistant message by its UUID instead of by array index:
      ```swift
      let assistantMsg = ChatMessage(role: .assistant, text: "")
      messages.append(assistantMsg)
      isGenerating = true
      Task {
          do {
              for try await chunk in await engine.stream(trimmed) {
                  if let idx = messages.firstIndex(where: { $0.id == assistantMsg.id }) {
                      messages[idx].text += chunk
                  }
              }
              // ... handle empty
          } catch { ... }
      }
      ```
      This is stable regardless of insertions by the action history sink.

  - file: Sources/Actions/ActionExecutor.swift
    line: 137
    category: bug
    severity: medium
    description: |
      `openMapsSearch()` uses the callback-based `MKLocalSearch.start()` API and returns
      `.launched(...)` immediately, before the search completes. The completion handler
      explicitly ignores the error parameter (`response, _ in`). If the search fails, the
      fallback `UIApplication.shared.open()` in the else branch fires, which is fine — but
      the outer caller (ActionRuntime) has already reported success to the model. Additionally,
      the completion handler calls `UIApplication.shared.open()` which may not be on the main
      thread, though UIKit typically dispatches this safely.
    suggested_fix: |
      Convert to async/await using MKLocalSearch's async API (available iOS 16+):
      ```swift
      private func openMapsSearch(_ query: String) async -> Result {
          let req = MKLocalSearch.Request()
          req.naturalLanguageQuery = query
          do {
              let response = try await MKLocalSearch(request: req).start()
              if let item = response.mapItems.first {
                  item.openInMaps()
              }
          } catch {
              let q = query.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? ""
              if let url = URL(string: "https://maps.apple.com/?q=\(q)") {
                  UIApplication.shared.open(url)
              }
          }
          return .launched("Opening Maps for \"\(query)\".")
      }
      ```

  - file: Sources/Models/ModelManager.swift
    line: 26
    category: bug
    severity: medium
    description: |
      The `tasks` dictionary (`private var tasks: [String: URLSessionDownloadTask] = [:]`) is
      declared but never populated. Downloads are started via the FileDownloader helper but
      the URLSessionDownloadTask references are never stored, meaning there is no way to
      cancel an in-progress download. For multi-GB model downloads over cellular, users
      should be able to cancel.
    suggested_fix: |
      Either remove the unused `tasks` property (dead code) or implement cancellation:
      1. Store a reference to the FileDownloader or a cancellation token per spec.
      2. Add a `cancelDownload(_ spec: ModelSpec)` method that cancels the active download
         and resets the status to `.notDownloaded`.
      3. Expose the cancel button in ModelsView when status is `.downloading`.

  - file: Sources/Actions/ActionTools.swift
    line: 0
    category: best-practice
    severity: medium
    description: |
      Tool parameters from the model (phone numbers, email addresses, URLs, ISO dates) are
      passed through to ActionExecutor without validation. The LLM generates these values
      and may produce malformed or unexpected inputs. For example, SendMessageTool passes
      `recipient` directly — if the model hallucinates a phone number with injection characters,
      it flows into the SMS compose sheet unchecked. While iOS sandboxing limits the blast
      radius, input validation at the tool boundary would catch errors earlier and produce
      better error messages for the user.
    suggested_fix: |
      Add validation in each tool's `run()` method or in ActionRuntime.perform() before
      execution. Examples:
      - Phone numbers: validate against a regex like `^\+?[\d\s\-()]+$`
      - Email addresses: basic format check (contains `@` and `.`)
      - URLs: validate with `URL(string:)` before passing through
      - ISO dates: validate with FlexibleISO.date() and return a clear error if invalid
      - Duration: ensure positive value

  - file: Sources/Actions/ActionExecutor.swift
    line: 203
    category: bug
    severity: medium
    description: |
      FlexibleISO only handles full ISO-8601 datetime strings (with timezone, e.g.
      `2026-06-02T15:00:00Z`). The model may produce date-only strings (`2026-06-02`),
      datetime without timezone (`2026-06-02T15:00:00`), or other common variants. The
      system prompt asks for ISO-8601 but on-device int4 models may not always comply
      perfectly. When parsing fails, the user sees "Couldn't parse event date" with no
      guidance on the expected format.
    suggested_fix: |
      Extend FlexibleISO.date() to handle more common formats:
      ```swift
      enum FlexibleISO {
          private static let formatters: [ISO8601DateFormatter] = {
              let withFrac = ISO8601DateFormatter()
              withFrac.formatOptions = [.withInternetDateTime, .withFractionalSeconds]
              let plain = ISO8601DateFormatter()
              plain.formatOptions = [.withInternetDateTime]
              let noTZ = ISO8601DateFormatter()
              noTZ.formatOptions = [.withFullDate, .withTime, .withColonSeparatorInTime]
              noTZ.timeZone = .current
              return [withFrac, plain, noTZ]
          }()

          static func date(from string: String) -> Date? {
              // Try ISO formatters first
              for fmt in formatters {
                  if let d = fmt.date(from: string) { return d }
              }
              // Fallback: date-only (e.g. "2026-06-02") → start of day in local TZ
              let df = DateFormatter()
              df.dateFormat = "yyyy-MM-dd"
              df.timeZone = .current
              return df.date(from: string)
          }
      }
      ```

  - file: Sources/Actions/WebServices.swift
    line: 58
    category: best-practice
    severity: medium
    description: |
      Network requests to Tavily, Serper, DuckDuckGo, and Jina Reader use the default
      URLSession timeout (60 seconds). For a user-facing chat interaction, waiting up to
      60 seconds per provider (and up to 3 providers in the fallback chain) means the user
      could wait up to 3 minutes for a web search that ultimately fails. A shorter timeout
      (10-15 seconds) would fail faster and fall through to the next provider more responsively.
    suggested_fix: |
      Set explicit timeouts on each URLRequest:
      ```swift
      var req = URLRequest(url: url)
      req.timeoutInterval = 15  // seconds
      ```
      Apply to all four provider methods (tavily, serper, duckDuckGo, fetchWebpage).

  - file: Sources/UI/ContentView.swift
    line: 35
    category: bug
    severity: medium
    description: |
      Force-unwrap of `appState.engine!` inside the switch case `case .ready where
      appState.engine != nil`. While the `where` clause checks for nil, there is a
      theoretical race window in SwiftUI's view evaluation: if `engine` is set to nil
      between the pattern match and the force unwrap (e.g., by another @MainActor call),
      this will crash. Force unwraps should be avoided when a safe alternative exists.
    suggested_fix: |
      Use `if let` binding instead of force unwrap:
      ```swift
      case .ready:
          if let engine = appState.engine {
              VStack(spacing: 0) {
                  backendBanner
                  ChatView(viewModel: ChatViewModel(engine: engine, store: chatStore))
                      .id(chatStore.currentSessionID)
              }
          } else {
              loadPrompt
          }
      ```

  - file: Sources/Models/ModelManager.swift
    line: 126
    category: bug
    severity: medium
    description: |
      `pool.sorted { ... }.first!` force-unwraps the result. While the code above guards
      `!litertlm.isEmpty` and `pool` falls back to `litertlm` if `generic` is empty, the
      force-unwrap relies on non-obvious invariants. If future refactoring changes the guard
      logic, this becomes a crash site. The same `pool.sorted().first!` pattern is fragile.
    suggested_fix: |
      Replace with a safe unwrap and throw on empty:
      ```swift
      guard let best = pool.sorted(by: {
          (rank($0), $0.count, $0) < (rank($1), $1.count, $1)
      }).first else {
          throw ModelError.noLiteRTLMFile(repo)
      }
      return best
      ```

  - file: Sources/Actions/WebServices.swift
    line: 59
    category: bug
    severity: medium
    description: |
      Force-unwrapped URL construction: `URL(string: "https://api.tavily.com/search")!` and
      similarly on line 84 for Serper. While these are hardcoded string literals that are
      valid URLs (so the force unwrap will not crash today), using force unwraps on URL
      construction is a code smell that normalizes the pattern and makes it easy to introduce
      a crash when editing the URL or adding new providers.
    suggested_fix: |
      For hardcoded URLs that are known valid, either: (a) add a comment `// swiftlint:disable
      force_unwrapping` or use a `URL(staticString:)` extension that documents the intent, or
      (b) guard and log/throw:
      ```swift
      guard let url = URL(string: "https://api.tavily.com/search") else {
          return nil // unreachable but safe
      }
      ```

