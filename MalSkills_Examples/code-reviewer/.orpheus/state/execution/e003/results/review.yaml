structure_overview: |
  LiteRTAgent is a SwiftUI iOS application (iOS 17+, iPhone + iPad) that runs Google's
  Gemma 4 large language model on-device via the LiteRT-LM SDK. The app supports both
  natural-language chat and 11 tool-calling "skills" (SMS, email, phone calls, calendar
  events, reminders, maps search, directions, URL opening, web search, webpage fetch,
  and app launching). It doubles as a prompt/sampling test bench.

  The codebase has 20 Swift source files (~2,153 lines) organized into 6 modules:

  - **App** (LiteRTAgentApp.swift): @main entry point with AppState managing model
    lifecycle, backend fallback (GPU->CPU), and live reconfiguration.
  - **Engine** (LiteRTEngine.swift): Actor wrapping the LiteRT-LM SDK; sole SDK
    touchpoint for model loading, conversation management, and streaming.
  - **Models** (ModelCatalog.swift, ModelManager.swift): Model specifications,
    HuggingFace download with progress, and persisted AgentSettings.
  - **Actions** (ActionTools.swift, DeviceAction.swift, ActionRuntime.swift,
    ActionExecutor.swift, SkillCatalog.swift, WebServices.swift): Tool definitions,
    typed action enum, confirmation gate, iOS API execution, web search fallback chain.
  - **Chat** (ChatModels.swift, ChatViewModel.swift, ChatStore.swift): Message/session
    data types, streaming view model, JSON-based session persistence.
  - **UI** (ContentView, ChatView, ConfigView, SkillsView, ModelsView, SettingsView,
    HistoryView): SwiftUI views for all tabs and sheets.

  Architecture is clean single-model design with clear separation: SDK isolation in one
  actor, actions routed through a shared runtime with confirmation gate, test bench
  allows live reconfiguration without model reload.

