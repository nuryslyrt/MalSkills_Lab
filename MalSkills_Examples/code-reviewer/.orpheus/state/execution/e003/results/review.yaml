  # ============================================================
  # CRITICAL
  # ============================================================

  - file: .env
    line: 1
    category: best-practice
    severity: critical
    description: |
      The .env file contains a hardcoded AWS secret access key
      (AWS_SECRET_ACCESS_KEY=NURGUCU_v2_key_d34e9e9cce5fac8a) and is tracked by git.
      The .gitignore file does not exclude .env files. This credential is exposed to
      anyone who clones the repository. Even if the key is a placeholder or test value,
      committing secrets to version control violates fundamental security hygiene and
      establishes a dangerous pattern.
    suggested_fix: |
      1. Add `.env` to .gitignore immediately.
      2. Rotate the AWS key (assume it is compromised).
      3. Remove the .env file from git history: `git filter-repo --path .env --invert-paths`
         or use BFG Repo Cleaner.
      4. If the app needs AWS credentials, use iOS Keychain or a backend proxy, never a
         flat file in the repo.

  # ============================================================
  # HIGH
  # ============================================================

  - file: Sources/Models/ModelManager.swift
    line: 21
    category: best-practice
    severity: high
    description: |
      The HuggingFace access token is stored in plaintext UserDefaults
      (`UserDefaults.standard.string(forKey: "hfToken")`). UserDefaults is an unencrypted
      plist file on disk, readable by any process with file-system access or via device
      backups. Bearer tokens are sensitive credentials that should be stored in the iOS
      Keychain, which provides hardware-backed encryption.
    suggested_fix: |
      Replace the UserDefaults storage with a Keychain wrapper. Use Security framework directly
      or a lightweight wrapper:
      ```swift
      import Security
      private enum KeychainHelper {
          static func save(_ value: String, forKey key: String) { ... }
          static func load(forKey key: String) -> String? { ... }
          static func delete(forKey key: String) { ... }
      }
      ```
      Then change the hfToken property to read/write through the Keychain helper instead of
      UserDefaults.

  - file: Sources/UI/SettingsView.swift
    line: 8
    category: best-practice
    severity: high
    description: |
      API keys for Tavily, Serper, and Jina are stored via @AppStorage (backed by UserDefaults)
      in plaintext. These are third-party API credentials that grant access to paid services.
      The same concern applies as with the HF token: UserDefaults is unencrypted and accessible
      in device backups. The README even notes "use a backend proxy for App Store distribution,"
      but the current storage is insecure even for development.
    suggested_fix: |
      Store all API keys in the iOS Keychain. Replace @AppStorage bindings with a custom
      Binding that reads/writes through a Keychain helper. Example:
      ```swift
      private var tavilyKeyBinding: Binding<String> {
          Binding(
              get: { KeychainHelper.load(forKey: "tavilyKey") ?? "" },
              set: { KeychainHelper.save($0, forKey: "tavilyKey") }
          )
      }
      ```
      Update WebServices.key() to read from Keychain instead of UserDefaults.

  - file: Sources/Models/ModelManager.swift
    line: 67
    category: bug
    severity: high
    description: |
      Force-unwrapped URL construction: `URL(string: "https://huggingface.co/\(spec.hfRepo)/
      resolve/main/\(filename)?download=true")!`. If the resolved filename contains characters
      that are not valid in a URL (spaces, certain Unicode), this will crash. The same pattern
      appears at line 95 (`URL(string: "https://huggingface.co/api/models/\(repo)")!`). Since
      `filename` and `repo` come from remote API responses, they are not guaranteed to be
      URL-safe.
    suggested_fix: |
      Use percent-encoding for the dynamic components and guard against nil:
      ```swift
      guard let encodedFilename = filename.addingPercentEncoding(
                withAllowedCharacters: .urlPathAllowed),
            let remote = URL(string:
                "https://huggingface.co/\(spec.hfRepo)/resolve/main/\(encodedFilename)?download=true")
      else {
          throw ModelError.invalidURL(filename)
      }
      ```
      Apply the same pattern to the API URL on line 95.

  - file: Sources/Actions/ActionExecutor.swift
    line: 145
    category: bug
    severity: high
    description: |
      Force-unwrapped URL construction in the Maps fallback path:
      `UIApplication.shared.open(URL(string: "http://maps.apple.com/?q=\(q)")!)`.
      Although `q` is percent-encoded, the force unwrap means a nil URL (from an encoding
      edge case) would crash the app. The same issue appears at line 154 with the directions URL.
      Both also use `http://` instead of `https://`.
    suggested_fix: |
      Guard the URL construction and use HTTPS:
      ```swift
      if let url = URL(string: "https://maps.apple.com/?q=\(q)") {
          UIApplication.shared.open(url)
      }
      ```
      Apply the same safe pattern to the directions URL on line 154.

  - file: Sources/Actions/ActionRuntime.swift
    line: 9
    category: bug
    severity: high
    description: |
      ActionRuntime is a non-isolated ObservableObject class with @Published properties accessed
      from multiple concurrency contexts. The `perform()` method (line 26) is called from
      background tool execution threads, but modifies state through @MainActor-isolated helper
      methods. While the individual helper methods are correctly isolated, the `confirmBeforeActing`
      property (line 20) is a plain `var` with no isolation — it is written from `AppState.configure()`
      on the MainActor (line 124 of LiteRTAgentApp.swift) and read via `shouldConfirm()` which
      dispatches to MainActor. This works in practice but is fragile: a future caller could read
      `confirmBeforeActing` without the MainActor dispatch, creating a data race. Under strict
      concurrency checking this will produce warnings.
    suggested_fix: |
      Mark the entire ActionRuntime class as `@MainActor`:
      ```swift
      @MainActor
      final class ActionRuntime: ObservableObject { ... }
      ```
      This is consistent with how it is already used (all mutation methods are @MainActor, it is
      injected as an environmentObject, the UI observes it). The `perform()` method is already
      called with `await`, so adding @MainActor would not change call sites. Alternatively, if
      perform() must stay non-isolated for performance, make `confirmBeforeActing` a proper
      actor-isolated property.

