  - file: Sources/Models/ModelCatalog.swift
    line: 82
    category: bug
    severity: low
    description: |
      `AgentSettings.save()` silently swallows encoding errors with `try?`. If encoding
      fails (unlikely but possible with custom types), the user's settings are lost without
