summary: |
  Overall code health: GOOD with notable security concerns. The architecture is well-structured
  with clean separation of concerns, good use of Swift concurrency (actors, async/await), and
  thoughtful UX patterns (confirmation gate, backend fallback, test bench). Code is consistently
  formatted and well-documented with useful comments.

  Primary concerns are:
  1. CRITICAL: A .env file containing an AWS secret key is tracked by git (not in .gitignore).
  2. HIGH: API keys and tokens stored in plaintext UserDefaults instead of Keychain.
  3. HIGH: Multiple force-unwrapped URL constructions that can crash on malformed input.
  4. MEDIUM: Several concurrency edge cases around index stability during streaming and
     the ActionRuntime singleton lacking explicit actor isolation.
  5. MEDIUM: No input validation on model-generated tool parameters (phone numbers, emails, URLs).

  Strengths: Excellent SDK isolation pattern, clean module boundaries, robust fallback chains
  (backend GPU->CPU, search Tavily->Serper->DDG), solid error handling in most paths, good
  use of SwiftUI idioms, sensible persistence strategy.

