  - file: Sources/Chat/ChatStore.swift
    line: 35
    category: complexity
    severity: low
    description: |
      `startNew()` appends a new ChatSession to the in-memory `sessions` array every time
      it is called, but empty placeholder sessions are never cleaned up until the app
      restarts (they are loaded from disk on init, and `loadAll()` only reads files that
      exist). Over a long session of creating many new chats without typing in them, the
      array grows with empty entries. This is unlikely to cause issues in practice but is
      untidy.
    suggested_fix: |
      Clean up empty placeholder sessions before creating a new one:
      ```swift
      func startNew() {
          sessions.removeAll { !$0.hasContent && $0.id != currentSessionID }
          let fresh = ChatSession()
          sessions.append(fresh)
          currentSessionID = fresh.id
      }
      ```

  - file: Sources/Actions/ActionExecutor.swift
    line: 30
    category: best-practice
    severity: low
    description: |
      The `tel://` URL scheme used for phone calls (`"tel://\(digits(number))"`) includes a
      double slash. Apple's documentation specifies `tel:` (single colon, no slashes) as the
      correct scheme. While `tel://` works in practice on iOS, it is not the documented form
      and could break on future OS versions or other platforms.
    suggested_fix: |
      Use the documented scheme: `"tel:\(digits(number))"` (no `//`).

  - file: Sources/Engine/LiteRTEngine.swift
    line: 84
    category: complexity
    severity: low
    description: |
      The `stream()` method wraps an AsyncThrowingStream around a Task that iterates another
      AsyncSequence. This double-wrapping (AsyncThrowingStream containing a Task iterating an
      async for-in) adds unnecessary indirection. The inner Task captures `self` (the actor)
      and `conversation`, but since the method is already on the actor, it could return the
      SDK's stream directly or use a simpler adapter. The current pattern also means there is
      no way to cancel the inner Task from outside.
    suggested_fix: |
      If the SDK's `sendMessageStream` already returns an `AsyncThrowingStream` or
      `AsyncSequence`, consider returning it directly (or mapping it) instead of wrapping:
      ```swift
      func stream(_ text: String) async throws -> AsyncThrowingStream<String, Error> {
          guard let conversation else { throw EngineError.notReady }
          return conversation.sendMessageStream(Message(text)).map { $0.toString }
      }
      ```
      If the wrapping is needed for actor isolation, add a cancellation mechanism via
      `withTaskCancellationHandler`.

  - file: Sources/Actions/SkillCatalog.swift
    line: 43
    category: readability
    severity: low
    description: |
      The `groups` computed property uses a manual `seen` Set + `order` Array pattern
      crammed into a single line to preserve insertion order. This is correct but hard to
      read at a glance, especially the compound `for ... where` on one line.
    suggested_fix: |
      Use Swift's `reduce(into:)` or break into multiple lines for clarity:
      ```swift
      static var groups: [String] {
          var seen = Set<String>()
          return all.compactMap { skill in
              seen.insert(skill.group).inserted ? skill.group : nil
          }
      }
      ```

