  - file: Sources/Actions/ActionExecutor.swift
    line: 190
    category: best-practice
    severity: info
    description: |
      The MFMessageComposeViewControllerDelegate and MFMailComposeViewControllerDelegate
      methods use `MainActor.assumeIsolated` inside `nonisolated` methods. This is correct
      because UIKit delivers these callbacks on the main thread, and the comment explains
      the reasoning. However, `MainActor.assumeIsolated` will trap (crash) if the assumption
      is ever wrong. This is worth noting for future maintainers: if Apple ever changes the
      threading guarantee for these delegates, the app will crash rather than behave incorrectly.
    suggested_fix: |
      The current approach is acceptable and well-documented. As an alternative, consider
      using `Task { @MainActor in controller.dismiss(animated: true) }` which is safer
      (no crash if the assumption is wrong) at the cost of a one-frame delay.

  - file: Sources/UI/ChatView.swift
    line: 74
    category: readability
    severity: info
    description: |
      User message bubbles use `.foregroundStyle(.white)` for text on an accent-color
      background. If the user's accent color is light (e.g., yellow), white text will have
      poor contrast, failing WCAG accessibility guidelines. This is a common SwiftUI chat
      UI pattern but not fully accessible.
    suggested_fix: |
      Consider using a dynamic foreground color that adapts to the accent color brightness,
      or use a fixed dark background for user bubbles:
      ```swift
      .foregroundStyle(Color.accentColor.isLight ? .black : .white)
      ```
      Or use the `.primary` style on a `.tint` background that guarantees contrast.

