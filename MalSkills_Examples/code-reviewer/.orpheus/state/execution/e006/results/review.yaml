findings_count: 28

summary: |
  Overall the codebase is well-structured, clearly documented, and shows a
  mature understanding of SwiftUI, structured concurrency, and iOS platform
  APIs. The architecture cleanly separates concerns: UI / Chat logic / Model
  management / Action execution / Engine wrapper. Code is consistently
  formatted with helpful inline comments explaining non-obvious design
  decisions (e.g., snake_case naming to match SDK round-tripping, constrained
  decoding rationale, session lifecycle).

  The most significant issues are: (1) a security concern with API keys and
  the HuggingFace token stored in plaintext UserDefaults rather than Keychain,
  (2) several instances of silent error swallowing that could make debugging
  difficult, (3) a potential data-integrity issue in the model download flow
  where the existing file is deleted before the replacement download completes,
  (4) an unbounded in-memory action history, and (5) repeated allocation of
  expensive ISO8601DateFormatter objects. There are no critical bugs, but
  several medium-severity issues that should be addressed before production.

findings:
  # ── Security / Best-Practice ──────────────────────────────────────────

  - file: Sources/Models/ModelManager.swift
    line: 21
    category: best-practice
    severity: high
    description: >
      The HuggingFace access token is stored in plaintext UserDefaults. On a
      jailbroken device or via an iTunes backup, this token is trivially
      extractable. HuggingFace tokens grant read (and potentially write)
      access to the user's HF account and private repos.
    suggested_fix: >
      Store the token in the iOS Keychain using Security framework or a thin
      wrapper like KeychainAccess. Replace the UserDefaults read/write in the
      `hfToken` property with Keychain get/set calls:
        @Published var hfToken: String = Keychain.get("hfToken") ?? "" {
            didSet { Keychain.set(hfToken, forKey: "hfToken") }
        }

  - file: Sources/UI/SettingsView.swift
    line: 8
    category: best-practice
    severity: high
    description: >
      Web service API keys (Tavily, Serper, Jina) are stored via @AppStorage
      which uses UserDefaults -- same plaintext exposure as the HF token.
      These are paid API keys with monetary value.
    suggested_fix: >
      Move API key storage to the Keychain. Replace @AppStorage bindings with
      custom Bindings backed by a Keychain wrapper. WebServices.key() should
      read from Keychain instead of UserDefaults.

  # ── Bug / Edge-Case ──────────────────────────────────────────────────

  - file: Sources/Models/ModelManager.swift
    line: 138
    category: bug
    severity: high
    description: >
      In downloadFile(), the existing file at `dest` is deleted (line 138)
      before the new download begins. If the download subsequently fails
      (network error, disk full, etc.), the user loses the previously
      downloaded model with no way to recover it except re-downloading.
      For multi-GB model files on cellular or slow connections, this is a
      significant data-loss risk.
    suggested_fix: >
      Download to a temporary location first, then atomically replace the
      existing file only after the download succeeds:
        let tempDest = dest.appendingPathExtension("download")
        // ... download to tempDest ...
        if fm.fileExists(atPath: dest.path) { try fm.removeItem(at: dest) }
        try fm.moveItem(at: tempURL, to: dest)

  - file: Sources/UI/ChatView.swift
    line: 19
    category: bug
    severity: medium
    description: >
      `.onChange(of: viewModel.messages.last?.text)` triggers auto-scroll
      only when the last message's *text* changes. When a new message is
      appended whose text happens to equal the previous last message's text
      (e.g., two identical user messages, or "(done)" appearing twice), the
      onChange will not fire and the scroll will not happen. This is a subtle
      edge case but can cause the chat to appear stuck.
    suggested_fix: >
      Track the message count or the last message's ID instead of its text:
        .onChange(of: viewModel.messages.count) {
            if let last = viewModel.messages.last {
                withAnimation { proxy.scrollTo(last.id, anchor: .bottom) }
            }
        }

  - file: Sources/Chat/ChatViewModel.swift
    line: 59
    category: bug
    severity: medium
    description: >
      The streaming Task in send() captures `self` strongly. When the user
      switches to a different chat session (ContentView rebuilds the
      ChatViewModel via .id(chatStore.currentSessionID)), the old
      ChatViewModel may be mid-generation. The orphaned Task continues to
      run, consuming engine resources and potentially appending to a stale
      `messages` array. There is no cancellation mechanism.
    suggested_fix: >
      Store the Task and cancel it when the view model is deallocated or when
      the session changes:
        private var generationTask: Task<Void, Never>?
        func send(_ text: String) {
            // ...
            generationTask = Task { ... }
        }
        deinit { generationTask?.cancel() }
      Also check `Task.isCancelled` inside the streaming loop to stop early.

  - file: Sources/Actions/ActionRuntime.swift
    line: 17
    category: bug
    severity: medium
    description: >
      The `history` array is append-only with no pruning. In a long session
      with many tool invocations, this grows unbounded in memory. Each
      ActionRecord contains string data (skill, summary, detail). While
      unlikely to cause an OOM on its own, it adds to the already tight
      memory budget imposed by multi-GB model loading.
    suggested_fix: >
      Add a maximum capacity and trim old entries when exceeded:
        private let maxHistory = 200
        @MainActor private func record(...) {
            history.append(ActionRecord(...))
            if history.count > maxHistory { history.removeFirst(history.count - maxHistory) }
        }

  - file: Sources/Actions/ActionExecutor.swift
    line: 137
    category: bug
    severity: medium
    description: >
      openMapsSearch() uses the callback-based MKLocalSearch.start() API and
      returns .launched("Opening Maps...") immediately before the search
      completes. If the search finds no results, the fallback URL is opened
      inside the callback, but the model has already received the "launched"
      result. This mismatch means the model cannot know whether the search
      succeeded or fell back. More importantly, errors in the callback
      (e.g., network failure) are silently ignored.
    suggested_fix: >
      Convert to async/await using MKLocalSearch's async start() method
      (available since iOS 16) so the result accurately reflects what happened:
        private func openMapsSearch(_ query: String) async -> Result {
            let req = MKLocalSearch.Request()
            req.naturalLanguageQuery = query
            do {
                let response = try await MKLocalSearch(request: req).start()
                if let item = response.mapItems.first {
                    item.openInMaps()
                    return .launched("Opened Maps for \"\(query)\".")
                }
            } catch { /* fall through to URL fallback */ }
            let q = query.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? ""
            UIApplication.shared.open(URL(string: "http://maps.apple.com/?q=\(q)")!)
            return .launched("Opening Maps for \"\(query)\" (via URL fallback).")
        }

