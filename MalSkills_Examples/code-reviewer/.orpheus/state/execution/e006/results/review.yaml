  # ── Complexity / Maintainability ─────────────────────────────────────

  - file: Sources/App/LiteRTAgentApp.swift
    line: 40
    category: complexity
    severity: medium
    description: >
      AppState.loadAgent() is 52 lines long and handles simulator detection,
      backend fallback iteration, error accumulation, engine initialization,
      conversation configuration, and state updates. Mixing platform-specific
      conditional compilation (#if targetEnvironment) with retry logic makes
      the method hard to follow and test.
    suggested_fix: >
      Extract the backend resolution into a separate method:
        private func resolveBackends(requested: LiteRTBackend) -> (backends: [LiteRTBackend], note: String?) {
            #if targetEnvironment(simulator)
            let note = requested == .gpu
                ? "GPU (Metal) isn't available in the Simulator -- running on CPU."
                : nil
            return ([.cpu], note)
            #else
            return (requested == .gpu ? [.gpu, .cpu] : [.cpu], nil)
            #endif
        }
      This makes loadAgent() shorter and the platform logic independently testable.

