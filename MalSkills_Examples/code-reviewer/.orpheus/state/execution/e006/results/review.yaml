  - file: Sources/Actions/ActionTools.swift
    line: 134
    category: best-practice
    severity: info
    description: >
      The `allTools` array instantiates every Tool struct eagerly at static
      init time, even though only the enabled subset is ever used. For 11
      lightweight structs this is negligible, but the pattern does not scale
      if tools become heavier (e.g., holding resources).
    suggested_fix: >
      This is fine for the current scale. If tools become heavier, consider
      lazy instantiation:
        static func tools(enabled: Set<String>) -> [Tool] {
            enabled.compactMap { name in toolFactory[name]?() }
        }
      where toolFactory maps names to closures.
