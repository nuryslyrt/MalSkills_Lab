        private static let logger = Logger(subsystem: "com.example.LiteRTAgent", category: "ChatStore")

        private func save(_ session: ChatSession) {
            do {
                let data = try JSONEncoder().encode(session)
                try data.write(to: Self.fileURL(for: session.id), options: .atomic)
            } catch {
                Self.logger.error("Failed to save session \(session.id): \(error.localizedDescription)")
            }
