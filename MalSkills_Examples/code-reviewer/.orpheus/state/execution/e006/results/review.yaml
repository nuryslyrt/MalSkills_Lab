  - file: Sources/Actions/ActionExecutor.swift
    line: 170
    category: best-practice
    severity: medium
    description: >
      normalizeURL() uses a simple prefix check to decide whether to prepend
      "https://". It does not handle inputs with spaces, special characters,
      or malformed schemes (e.g. "ftp:example.com"). This could cause
      UIApplication.open to fail silently or open unexpected URLs.
    suggested_fix: >
      Add URL encoding for the input and validate the result:
        private func normalizeURL(_ s: String) -> String {
            let trimmed = s.trimmingCharacters(in: .whitespacesAndNewlines)
            let withScheme = (trimmed.hasPrefix("http://") || trimmed.hasPrefix("https://")
                              || trimmed.contains("://")) ? trimmed : "https://\(trimmed)"
            return withScheme.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed)
                   ?? withScheme
        }

  - file: Sources/Actions/ActionExecutor.swift
    line: 182
    category: best-practice
    severity: low
    description: >
      topViewController() traverses the view controller hierarchy by
      checking `presentedViewController`. This is a common pattern but
      fragile: it depends on UIKit's presentation stack being linear, may
      not work correctly with UIKit/SwiftUI hybrid navigation (e.g.,
      NavigationStack with sheets), and breaks if multiple windows are
      active (iPad multitasking, external display).
    suggested_fix: >
      Consider using a dedicated "presenter" pattern where the ActionExecutor
      receives a reference to the presenting UIViewController via dependency
      injection, or use UIKit's rootViewController directly since the app
      has a single-window SwiftUI layout. For robustness:
        private func present(_ vc: UIViewController) {
            guard let scene = UIApplication.shared.connectedScenes
                .compactMap({ $0 as? UIWindowScene })
                .first(where: { $0.activationState == .foregroundActive }),
                  let root = scene.windows.first(where: { $0.isKeyWindow })?.rootViewController
            else { return }
            var top = root
            while let presented = top.presentedViewController { top = presented }
            top.present(vc, animated: true)
        }

  - file: Sources/Actions/ActionExecutor.swift
    line: 193
    category: best-practice
    severity: low
    description: >
      The MFMessageComposeViewControllerDelegate and
      MFMailComposeViewControllerDelegate implementations use
      `MainActor.assumeIsolated` which is an assertion, not a guarantee.
      While UIKit does call delegates on the main thread, using
      `assumeIsolated` in production code means a crash (not just undefined
      behavior) if the assumption is ever violated.
    suggested_fix: >
      Use `MainActor.run` for safety, or acknowledge the trade-off with a
      comment. Alternatively, since iOS 17 is the deployment target, consider
      marking the delegate methods with @MainActor using the nonisolated
      override approach that is standard in Swift 6 concurrency:
        nonisolated func messageComposeViewController(...) {
            Task { @MainActor in controller.dismiss(animated: true) }
        }
      Note: Task dispatch adds a frame of delay but is safe in all scenarios.

