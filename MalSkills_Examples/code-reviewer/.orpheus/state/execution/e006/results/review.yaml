structure_overview: |
  LiteRTAgent is a SwiftUI iOS application that runs on-device LLMs (primarily
  Gemma 4) via Google's LiteRT-LM SDK to provide an agent capable of calling
  iOS device APIs (messaging, calendar, maps, web search, etc.) through a
  tool-calling interface. The project is organized into five modules:

  **App** (1 file) -- Entry point (`LiteRTAgentApp`). Houses `AppState`, an
  `ObservableObject` that owns the `LiteRTEngine` lifecycle and agent
  configuration. Handles backend fallback logic (GPU -> CPU) and simulator
  detection.

  **UI** (7 files) -- SwiftUI views. `ContentView` is the root `TabView`.
  `ChatTab` manages load state and navigation. `ChatView` displays the
  conversation and an input bar. `ModelsView` shows downloadable model
  specs. `SettingsView` manages backend, API keys, and HuggingFace token.
  `ConfigView` is a live "test bench" for system prompt, sampling, and
  engine parameters. `HistoryView` lets users browse and restore saved
  chats. `SkillsView` exposes toggles for each tool the model can call.

  **Chat** (3 files) -- Data models (`ChatMessage`, `ChatSession`) and
  persistence (`ChatStore` -- one JSON file per session in Application
  Support/Chats). `ChatViewModel` bridges the UI to the engine's streaming
  API and persists transcripts.

  **Models** (2 files) -- `ModelCatalog` defines available model specs.
  `ModelManager` handles downloading `.litertlm` files from HuggingFace,
  including API-driven filename resolution, progress tracking, and
  delegate-based large-file downloads. `AgentSettings` (in ModelCatalog.swift)
  is the user-editable agent configuration persisted via UserDefaults.

  **Actions** (6 files) -- The tool-calling layer. `DeviceAction` is an enum
  of all executable actions. `ActionTools` wraps each action as a LiteRT-LM
  `Tool` struct. `ActionRuntime` is the shared bridge between SDK tool
  invocations and `ActionExecutor`, adding user-confirmation gating and
  history logging. `ActionExecutor` implements each action via Apple APIs
  (EventKit, MessageUI, MapKit, UIApplication). `SkillCatalog` provides
  metadata for the Skills UI. `WebServices` implements a fallback-chain
  web search (Tavily -> Serper -> DuckDuckGo) and page fetching (Jina Reader).

  **Engine** (1 file) -- `LiteRTEngine`, an actor wrapping the LiteRT-LM SDK.
  Manages model loading, conversation configuration, and streaming generation.
  Enables constrained decoding for reliable tool-call formatting.

  **Build** -- XcodeGen-based (`project.yml`). Targets iOS 17+, Swift 5.9.
  Depends on LiteRT-LM via SwiftPM (pinned to a specific revision).
  Requests increased memory entitlement for multi-GB model loading.

