    line: 74
    category: best-practice
    severity: medium
    description: >
      The save() method in AgentSettings (in ModelCatalog.swift, line 82)
      and the download error path in ModelManager silently discard encoding/
      IO errors with `try?`. If settings fail to save, the user's
      configuration changes are lost without any indication.
    suggested_fix: >
      Use do/catch with os.Logger for diagnostics, or surface the error in
      the UI:
