  - file: Sources/Actions/ActionExecutor.swift
    line: 205
    category: bug
    severity: low
    description: >
      FlexibleISO.date(from:) allocates two new ISO8601DateFormatter
      instances on every call. These are expensive objects. For calendar event
      and reminder creation, this is called at least once per action, and the
      formatters are immediately discarded.
    suggested_fix: >
      Use static cached formatters:
        enum FlexibleISO {
            private static let withFraction: ISO8601DateFormatter = {
                let f = ISO8601DateFormatter()
                f.formatOptions = [.withInternetDateTime, .withFractionalSeconds]
                return f
            }()
            private static let plain: ISO8601DateFormatter = {
                let f = ISO8601DateFormatter()
                f.formatOptions = [.withInternetDateTime]
                return f
            }()
            static func date(from string: String) -> Date? {
                withFraction.date(from: string) ?? plain.date(from: string)
            }
        }

