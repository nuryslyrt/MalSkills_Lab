                if case .failed = status[spec.id] { return true }
                return false
            }() else { return }
            status[spec.id] = .downloading(progress: 0)
            // ...
        }
        ```
        Or more concisely:
        ```swift
        switch status[spec.id] {
        case .notDownloaded, .failed: break
        default: return
        }
        ```

