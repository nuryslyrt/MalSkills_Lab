  structure_overview: |
    LiteRTAgent is a Swift/SwiftUI iOS application (iOS 17+) that runs on-device LLM inference
    using Google's LiteRT-LM SDK. The app lets users chat with a locally-running Gemma model
    that can invoke device actions (messaging, calls, calendar, maps, web search) through a
    tool-calling architecture. The project uses XcodeGen (project.yml) for project generation
    and depends on the LiteRT-LM Swift SDK via SwiftPM.

    Directory layout:
