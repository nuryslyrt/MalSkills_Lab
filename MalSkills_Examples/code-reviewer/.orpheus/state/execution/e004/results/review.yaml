    - file: "Sources/Actions/ActionExecutor.swift"
      line: 182
      category: best-practice
      severity: low
      description: |
        `topViewController()` traverses the view hierarchy to find the top-most presented
        controller. This is a UIKit pattern that works but is fragile with SwiftUI's hosting
        controller hierarchy. On iPad with multiple scenes, `connectedScenes.first` may not
        return the expected scene.
      suggested_fix: |
        Filter for the foreground active scene more robustly, or consider using SwiftUI's
        native sheet/fullScreenCover presentation for composers instead of UIKit presentation:
        ```swift
        private func topViewController() -> UIViewController? {
            let scenes = UIApplication.shared.connectedScenes
                .compactMap { $0 as? UIWindowScene }
                .filter { $0.activationState == .foregroundActive }
            guard let scene = scenes.first else { return nil }
            var top = scene.windows.first { $0.isKeyWindow }?.rootViewController
            while let presented = top?.presentedViewController { top = presented }
            return top
        }
        ```

