    - file: "Sources/Models/ModelManager.swift"
      line: 165
      category: best-practice
      severity: medium
      description: |
        `FileDownloader` accesses shared mutable state (`continuation`, `movedTempURL`,
        `lastResponse`, `progressHandler`) from multiple contexts: the async `download` method
        sets properties, while URLSession delegate methods read/write them from the delegate
        queue. Although the delegate queue is serial (nil = serial OperationQueue), there is
        no formal synchronization guarantee between the async context that sets `continuation`
        and the delegate queue that reads it. This is safe in practice because `continuation`
        is set before the download task resumes, but the code is fragile and would break if
        refactored to start the task earlier.
      suggested_fix: |
        Consider using `URLSession.data(for:delegate:)` (iOS 15+) with the delegate for progress,
        which eliminates the need for the continuation pattern entirely. Alternatively, mark the
        shared properties as explicitly synchronized or document the ordering contract.

