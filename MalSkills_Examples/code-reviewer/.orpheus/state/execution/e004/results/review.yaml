  summary: |
    The codebase is well-structured and generally well-written for an early-stage iOS app.
    The architecture cleanly separates concerns: a single SDK integration point (LiteRTEngine),
    a tool-calling layer (ActionTools/ActionRuntime/ActionExecutor), persistence (ChatStore),
    and SwiftUI views. Code is readable with good comments explaining non-obvious decisions
    (e.g., snake_case SDK round-tripping, constrained decoding, Simulator fallback).

    The most urgent issue is a SECRET KEY in an unprotected .env file that could easily be
    committed to version control. Beyond that, there are concurrency concerns in ActionRuntime
    (concurrent tool approvals could deadlock), several force-unwraps that could crash in edge
    cases, silent error swallowing in persistence, and an uncancellable streaming task. The UI
    layer is clean with minor inefficiencies (ChatViewModel instantiation pattern).

    Overall code health: FAIR. The architecture is sound but needs hardening around error
    handling, concurrency safety, and secret management before production use.

