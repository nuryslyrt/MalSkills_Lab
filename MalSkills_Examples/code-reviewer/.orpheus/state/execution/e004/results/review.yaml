    - file: "Sources/UI/ContentView.swift"
      line: 34
      category: bug
      severity: high
      description: |
        `ChatView` declares `@StateObject var viewModel: ChatViewModel`, but the ChatViewModel is
        instantiated in the parent's body (`ChatViewModel(engine:store:)`). This means a new
        ChatViewModel is allocated every time ContentView's body is re-evaluated, even though
        @StateObject discards all but the first instance (per view identity). These throwaway
        allocations are wasteful, and the pattern is semantically incorrect: @StateObject is for
        view-owned objects initialized inside the view, while @ObservedObject is for externally-
        provided objects.
      suggested_fix: |
        Either (a) change ChatView to use `@ObservedObject` and manage the ChatViewModel lifecycle
        in the parent via @StateObject, or (b) use a factory pattern:
        ```swift
        // Option A: Parent owns the ViewModel
        @StateObject private var chatViewModel: ChatViewModel  // in ChatTab
        // Initialize when engine becomes available

        // Option B: Use @ObservedObject in ChatView
        struct ChatView: View {
            @ObservedObject var viewModel: ChatViewModel
            // ...
        }
        ```

    - file: "Sources/Actions/ActionExecutor.swift"
      line: 137
      category: bug
      severity: medium
      description: |
        `openMapsSearch` starts an asynchronous `MKLocalSearch` with a completion handler but
        returns `.launched` immediately. If the search fails or returns no results, the fallback
        URL is opened in the completion handler, but the caller (and by extension the LLM) has
        already received the "launched" result. There is no way to report the search failure back
        to the model or the user. Additionally, the completion handler runs on an arbitrary thread
        but calls `UIApplication.shared.open` which should be on the main thread.
      suggested_fix: |
        Convert to async/await and return the actual result:
        ```swift
        private func openMapsSearch(_ query: String) async -> Result {
            let req = MKLocalSearch.Request()
            req.naturalLanguageQuery = query
            do {
                let response = try await MKLocalSearch(request: req).start()
                if let item = response.mapItems.first {
                    item.openInMaps()
                } else {
                    let q = query.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? ""
                    await UIApplication.shared.open(URL(string: "http://maps.apple.com/?q=\(q)")!)
                }
                return .launched("Opening Maps for \"\(query)\".")
            } catch {
                return .failed("Maps search failed: \(error.localizedDescription)")
            }
        }
        ```

    - file: "Sources/Actions/ActionRuntime.swift"
      line: 57
      category: bug
      severity: medium
      description: |
        `requestApproval` stores a `PendingApproval` with a `CheckedContinuation` closure. If
        the approval sheet is dismissed without calling `resolve` (e.g., through a SwiftUI bug
        or an unexpected dismissal path), the continuation is never resumed, causing the calling
        Task to hang permanently. `withCheckedContinuation` will trap in debug mode if the
        continuation is leaked, but in release builds this silently leaks the Task.
      suggested_fix: |
        Add a timeout or use `withCheckedThrowingContinuation` with a cancellation handler:
        ```swift
        @MainActor private func requestApproval(_ action: DeviceAction) async -> Bool {
            await withTaskCancellationHandler {
                await withCheckedContinuation { cont in
                    pendingApproval = PendingApproval(action: action) { approved in
                        cont.resume(returning: approved)
                    }
                }
            } onCancel: {
                Task { @MainActor in
                    resolve(approved: false)
                }
            }
        }
        ```

