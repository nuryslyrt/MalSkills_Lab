    - file: "Sources/Actions/ActionRuntime.swift"
      line: 26
      category: bug
      severity: high
      description: |
        The `perform` method is not actor-isolated or serialized. If the LLM emits multiple tool
        calls in a single response (which LiteRT-LM supports), multiple `perform` calls execute
        concurrently. When two non-read-only actions both reach `requestApproval`, the second
        overwrites `pendingApproval` (line 59), and the first action's CheckedContinuation is
        never resumed. This causes the first tool call to hang indefinitely, blocking the model's
        turn from completing.
      suggested_fix: |
        Serialize `perform` calls with an AsyncSemaphore or make ActionRuntime an actor. For example:
        ```swift
        actor ActionRuntime {
            // ... existing code ...
            // The actor serializes perform() calls automatically.
        }
        ```
        Alternatively, use a queue/channel pattern:
        ```swift
        private let approvalLock = AsyncSemaphore(value: 1)
        func perform(_ action: DeviceAction) async -> String {
            if !action.isReadOnly, await shouldConfirm() {
                await approvalLock.wait()
                defer { approvalLock.signal() }
                let approved = await requestApproval(action)
                // ...
            }
        }
        ```

    - file: "Sources/Engine/LiteRTEngine.swift"
      line: 85
      category: bug
      severity: high
      description: |
        The `stream` method creates a `Task` inside `AsyncThrowingStream` that is never stored
        or tracked. When the consumer of the stream is cancelled (e.g., the user navigates away
        or starts a new chat), the Task continues running until the model finishes generating.
        This wastes GPU/CPU resources and keeps the model's conversation session busy, potentially
        blocking the next user message.
      suggested_fix: |
        Store the Task and cancel it when the stream terminates. Use the stream's `onTermination`
        handler:
        ```swift
        func stream(_ text: String) -> AsyncThrowingStream<String, Error> {
            AsyncThrowingStream { continuation in
                let task = Task {
                    guard let conversation else {
                        continuation.finish(throwing: EngineError.notReady); return
                    }
                    do {
                        for try await chunk in conversation.sendMessageStream(Message(text)) {
                            try Task.checkCancellation()
                            continuation.yield(chunk.toString)
                        }
                        continuation.finish()
                    } catch {
                        continuation.finish(throwing: error)
                    }
                }
                continuation.onTermination = { _ in task.cancel() }
            }
        }
        ```

