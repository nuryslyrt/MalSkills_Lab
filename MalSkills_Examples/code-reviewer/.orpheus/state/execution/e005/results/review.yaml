  - file: "Sources/Actions/ActionExecutor.swift"
    line: 137
    category: bug
    severity: low
    description: |
      openMapsSearch starts an asynchronous MKLocalSearch but returns
      .launched("Opening Maps...") immediately before the search completes. If the
      search finds no results and falls back to a URL-based map open (line 144),
      there is a delay between the "Opening Maps" feedback and the actual map launch.
      If both the search and the fallback fail, no error is reported.
    suggested_fix: |
      Convert to async/await using withCheckedContinuation to await the search result
      before returning:

        private func openMapsSearch(_ query: String) async -> Result {
            let req = MKLocalSearch.Request()
            req.naturalLanguageQuery = query
            do {
                let response = try await MKLocalSearch(request: req).start()
                if let item = response.mapItems.first {
                    item.openInMaps()
                    return .launched("Opening Maps for \"\(query)\".")
                }
            } catch { }
            // Fallback
            let q = query.addingPercentEncoding(...) ?? ""
            UIApplication.shared.open(URL(string: "https://maps.apple.com/?q=\(q)")!)
            return .launched("Opening Maps for \"\(query)\".")
        }

  - file: "Sources/Chat/ChatStore.swift"
    line: 74
    category: readability
    severity: low
    description: |
      The save method silently swallows encoding and I/O errors with `try?` on lines
      74-75. If persistence fails (e.g., disk full, permission issue), the user's
      conversation is lost without any indication. Similar silent suppression occurs
      in the dir computed property (line 65) and delete (line 57).
    suggested_fix: |
      At minimum, log save failures so they are diagnosable. For user-facing impact,
      surface a save-failure state:

        private func save(_ session: ChatSession) {
            do {
                let data = try JSONEncoder().encode(session)
                try data.write(to: Self.fileURL(for: session.id), options: .atomic)
            } catch {
                print("[ChatStore] Failed to save session \(session.id): \(error)")
                // Optionally: publish a @Published saveError for UI to display
            }
        }

  - file: "Sources/Models/ModelManager.swift"
    line: 165
    category: complexity
    severity: low
    description: |
      FileDownloader conforms to NSObject and URLSessionDownloadDelegate, creating a
      tight coupling between the download lifecycle and delegate callbacks. The class
      uses CheckedContinuation which works but adds complexity. If the download is
      cancelled externally or the URLSession is deallocated before didCompleteWithError
      fires, the continuation may never resume, causing the calling Task to hang
      indefinitely.
    suggested_fix: |
      Use URLSession.shared.download(for:delegate:) with the newer async/await API
      (available since iOS 15) which handles cancellation and lifecycle automatically:

        let (tempURL, response) = try await URLSession.shared.download(
            for: authorizedRequest(remote),
            delegate: progressReporter
        )

      If byte-accurate progress is still needed, use a simple
      URLSessionTaskDelegate for progress updates.

  - file: "Sources/Chat/ChatViewModel.swift"
    line: 19
    category: complexity
    severity: low
    description: |
      ChatViewModel is instantiated inline in the parent view's body
      (ContentView line 35), meaning the initializer closure runs on every SwiftUI body
      re-evaluation. SwiftUI's @StateObject mitigates this by only using the first value
      and discarding subsequent initializations, but the work done in the init (loading
      from ChatStore, subscribing to ActionRuntime) still executes unnecessarily on
      every re-render before being thrown away.
    suggested_fix: |
      Move ChatViewModel creation to a factory closure or use @StateObject with a
      lazy-initialized wrapper to defer creation:

        @StateObject private var viewModel: ChatViewModel

        init(engine: LiteRTEngine, store: ChatStore) {
            _viewModel = StateObject(wrappedValue: ChatViewModel(engine: engine, store: store))
        }

      This ensures the initializer only runs when the view identity changes (controlled
      by .id()), not on every body pass.

  - file: ".gitignore"
    line: 0
    category: best-practice
    severity: low
    description: |
      The .gitignore file does not include .env or other common secret-bearing file
      patterns (.env.local, .env.*.local, *.key, *.pem). While .env is currently
      untracked, a future `git add -A` would commit it along with any secrets.
    suggested_fix: |
      Add these patterns to .gitignore:

        # Secrets / environment
        .env
        .env.*
        *.key
        *.pem
        *.p12

