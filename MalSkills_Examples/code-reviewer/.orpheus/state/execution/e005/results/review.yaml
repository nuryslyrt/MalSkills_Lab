summary: |
  Overall code health is GOOD with one critical and two high-severity issues.

  The codebase demonstrates strong architectural discipline: clean module boundaries,
  single-file SDK isolation, proper SwiftUI patterns (MVVM, environment objects,
  @StateObject), and thoughtful error handling throughout. The LiteRT-LM integration
  is well-documented with version pinning and API surface commentary. The
  GPU-to-CPU fallback and simulator detection are handled correctly.

  The critical issue is a leaked AWS secret in an unprotected .env file. The two high-
  severity issues are API keys stored in unencrypted UserDefaults (should use Keychain)
  and insufficient URL validation on model-generated inputs. The medium-severity issues
  center around a date-parsing bug that would reject the tool descriptions' own example
  format, missing streaming cancellation, and concurrency annotation gaps. Low and info
  findings are minor style and maintainability notes.

  Confidence: 0.92. The review covers all four quality dimensions across every file.
  No files were skipped.

findings:
  # ── CRITICAL ──────────────────────────────────────────────────────────────

  - file: ".env"
    line: 1
    category: best-practice
    severity: critical
    description: |
      The .env file contains a plaintext AWS secret access key
      (AWS_SECRET_ACCESS_KEY=NURGUCU_v2_key_d34e9e9cce5fac8a). The file is currently
      untracked by git but .gitignore does not list .env, so any `git add .` or
      `git add -A` will commit it. If this key is live, it must be rotated immediately.
      Secrets in repositories are the #1 cause of cloud account compromise.
    suggested_fix: |
      1. Add `.env` to .gitignore immediately.
      2. Delete the .env file or replace it with a .env.example containing placeholder
         values (e.g., AWS_SECRET_ACCESS_KEY=your_key_here).
      3. If the key was ever committed (check `git log --all -- .env`), rotate it in
         the AWS console immediately.
      4. Use environment variables or a secrets manager at runtime; never store real
         credentials in repository files.

  # ── HIGH ──────────────────────────────────────────────────────────────────

  - file: "Sources/Models/ModelManager.swift"
    line: 21
    category: best-practice
    severity: high
    description: |
      The HuggingFace access token is stored in plaintext UserDefaults
      (UserDefaults.standard, key "hfToken"). UserDefaults is an unencrypted plist file
      that is included in unencrypted device backups, accessible via MDM, and readable
      by any process with the same app group. Bearer tokens grant full API access to the
      user's HuggingFace account, including private models and organization repos.
    suggested_fix: |
      Store the token in the iOS Keychain instead of UserDefaults. Replace the
      @Published property with a Keychain-backed accessor:

        import Security

        private static func keychainSave(_ token: String, for key: String) { ... }
        private static func keychainLoad(_ key: String) -> String? { ... }

        @Published var hfToken: String = Self.keychainLoad("hfToken") ?? "" {
            didSet { Self.keychainSave(hfToken, for: "hfToken") }
        }

      Apply the same pattern to the Tavily, Serper, and Jina API keys in
      SettingsView.swift (currently using @AppStorage, which is also UserDefaults).

  - file: "Sources/Actions/ActionExecutor.swift"
    line: 161
    category: best-practice
    severity: high
    description: |
      The openScheme helper, used by OpenURLTool and OpenAppTool, passes model-
      generated strings directly to UIApplication.shared.open without validation beyond
      basic URL parsing. A prompt-injected or hallucinated model output could open
      arbitrary URL schemes (e.g., itms-services:// for enterprise provisioning profiles,
      or custom schemes that trigger side effects in installed apps). The openApp tool
      accepts any scheme string. While iOS sandboxing provides a baseline, the
      confirmation gate only fires when confirmBeforeActing is true, and read-only
      tools skip it entirely.
    suggested_fix: |
      Add an allowlist of permitted URL schemes to openScheme:

        private let allowedSchemes: Set<String> = [
            "tel", "sms", "mailto", "maps", "comgooglemaps",
            "http", "https", "music", "shortcuts"
        ]

        private func openScheme(_ string: String, label: String) -> Result {
            guard let url = URL(string: string),
                  let scheme = url.scheme?.lowercased(),
                  allowedSchemes.contains(scheme) else {
                return .failed("Blocked scheme: \(string)")
            }
            ...
        }

      For openApp, always require user confirmation regardless of the
      confirmBeforeActing setting (override isReadOnly for openApp).

  # ── MEDIUM ────────────────────────────────────────────────────────────────

  - file: "Sources/Actions/ActionExecutor.swift"
    line: 203
    category: bug
    severity: medium
    description: |
      FlexibleISO.date(from:) only handles ISO-8601 strings with a timezone designator
      (the Z or +HH:MM suffix), because both formatter configurations use
      .withInternetDateTime. However, the tool parameter descriptions provide examples
      without timezone designators (e.g., "2026-06-02T15:00:00"), and on-device int4
      models are unlikely to reliably produce the timezone suffix. Any date string without
      a timezone will fail to parse, causing the calendar event or reminder to fail with
      "Couldn't parse event date."
    suggested_fix: |
      Add a third fallback that parses date-only strings (no timezone), treating them
      as local time:

        static func date(from string: String) -> Date? {
            // Try with fractional seconds + timezone
            let withFraction = ISO8601DateFormatter()
            withFraction.formatOptions = [.withInternetDateTime, .withFractionalSeconds]
            if let d = withFraction.date(from: string) { return d }
            // Try standard Internet date-time
            let plain = ISO8601DateFormatter()
            plain.formatOptions = [.withInternetDateTime]
            if let d = plain.date(from: string) { return d }
            // Try without timezone (treat as local)
            let local = DateFormatter()
            local.dateFormat = "yyyy-MM-dd'T'HH:mm:ss"
            local.locale = Locale(identifier: "en_US_POSIX")
            return local.date(from: string)
        }

  - file: "Sources/Chat/ChatViewModel.swift"
    line: 59
    category: bug
    severity: medium
    description: |
      The streaming Task in send() cannot be cancelled by the user. Once generation
      starts, there is no mechanism to stop it -- the user must wait for the full
      response. For multi-GB on-device models generating at ~20 tokens/sec, a long
      response could take 30+ seconds with no way to interrupt. The UI shows an
      ellipsis but no stop button.
    suggested_fix: |
      Store the Task handle and add a cancel method:

        private var streamTask: Task<Void, Never>?

        func send(_ text: String) {
            ...
            streamTask = Task {
                do {
                    for try await chunk in await engine.stream(trimmed) {
                        guard !Task.isCancelled else { break }
                        if messages.indices.contains(assistantIndex) {
                            messages[assistantIndex].text += chunk
                        }
                    }
                    ...
                } catch { ... }
                isGenerating = false; persist()
            }
        }

        func stopGenerating() {
            streamTask?.cancel()
            isGenerating = false
        }

      Then add a stop button in ChatView's inputBar when isGenerating is true.

  - file: "Sources/UI/ContentView.swift"
    line: 35
    category: bug
    severity: medium
    description: |
      Force-unwrap of appState.engine! on line 35. While it is inside a guard
      (case .ready where appState.engine != nil), force unwraps are fragile under
      refactoring. If the guard condition is ever changed or the code restructured,
      this becomes a runtime crash. SwiftUI body evaluation must never crash.
    suggested_fix: |
      Use optional binding instead:

        case .ready:
            if let engine = appState.engine {
                VStack(spacing: 0) {
                    backendBanner
                    ChatView(viewModel: ChatViewModel(engine: engine, store: chatStore))
                        .id(chatStore.currentSessionID)
                }
            }

  - file: "Sources/Actions/ActionRuntime.swift"
    line: 9
    category: best-practice
    severity: medium
    description: |
      ActionRuntime is a plain class with a shared singleton but lacks formal actor
      isolation. Its mutable state (pendingApproval, history, confirmBeforeActing) is
      accessed from multiple concurrency domains: Tool.run() calls perform() from
      SDK-managed tasks, while UI code accesses it from @MainActor. The code works
      correctly because all state mutations are individually dispatched to MainActor,
      but this implicit contract is fragile and not enforced by the compiler. Swift 6
      strict concurrency checking will flag this.
    suggested_fix: |
      Mark the class @MainActor:

        @MainActor
        final class ActionRuntime: ObservableObject { ... }

      Then mark perform() as nonisolated and use explicit MainActor hops only where
      needed, or make it an actor with @Published wrappers adapted to ObservableObject.

  - file: "Sources/UI/SettingsView.swift"
    line: 8
    category: best-practice
    severity: medium
    description: |
      Tavily, Serper, and Jina API keys are stored via @AppStorage, which writes to
      unencrypted UserDefaults. This is the same vulnerability as the HuggingFace token
      in ModelManager. All four API keys should use the Keychain.
    suggested_fix: |
      Replace @AppStorage with Keychain-backed @State properties and a shared
      KeychainService helper. On appear, load from Keychain; on change, write to
      Keychain. Alternatively, create a KeychainStorage property wrapper that mirrors
      @AppStorage's interface but uses SecItemAdd/SecItemCopyMatching.

  - file: "project.yml"
    line: 41
    category: best-practice
    severity: medium
    description: |
      ENABLE_USER_SCRIPT_SANDBOXING is set to NO. While this may be needed for certain
      build scripts, disabling user script sandboxing allows Run Script build phases to
      access the network, user files, and other system resources unrestricted. This
      weakens the build-time security posture and was flagged as a concern by Apple
      starting in Xcode 14.
    suggested_fix: |
      If no custom Run Script phases require unsandboxed access, remove the line or
      set it to YES:

        ENABLE_USER_SCRIPT_SANDBOXING: YES

      If XcodeGen or another tool requires it, document why in a comment.

  - file: "Sources/Actions/ActionExecutor.swift"
    line: 145
    category: best-practice
    severity: medium
    description: |
      Map URLs in openMapsSearch (line 145) and openDirections (line 154) use the http://
      scheme for maps.apple.com. While Apple Maps likely redirects to HTTPS, the initial
      request travels unencrypted, exposing the user's search query or destination to
      network observers. iOS App Transport Security may block plain HTTP depending on
      the ATS configuration.
    suggested_fix: |
      Change both URLs to use https://:

        // Line 145:
        UIApplication.shared.open(URL(string: "https://maps.apple.com/?q=\(q)")!)

        // Line 154:
        let url = URL(string: "https://maps.apple.com/?daddr=\(q)&dirflg=\(dirflg)")!

  - file: "Sources/Models/ModelCatalog.swift"
    line: 73
    category: complexity
    severity: medium
    description: |
      AgentSettings includes a version key ("AgentSettings.v2") for UserDefaults
      serialization but provides no migration path from v1 or handling for future
      versions. If the schema changes (new fields, removed fields, type changes), the
      JSONDecoder will silently fail and return the default settings, potentially
      losing the user's carefully tuned prompt, sampling parameters, and skill selection
      without warning.
    suggested_fix: |
      Add a version field to the Codable struct and implement explicit migration:

        struct AgentSettings: Codable, Equatable {
            var version: Int = 2
            ...
            static func load() -> AgentSettings {
                guard let data = UserDefaults.standard.data(forKey: key) else { return .default }
                // Try current version first
                if let decoded = try? JSONDecoder().decode(AgentSettings.self, from: data) {
                    return decoded
                }
                // Try migrating from v1
                if let v1 = try? JSONDecoder().decode(AgentSettingsV1.self, from: data) {
                    return v1.migrated()
                }
                return .default
            }
        }

