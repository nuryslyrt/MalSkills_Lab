  - id: tool_contract_soundness
    statement: >
      Every producer/consumer contract chain has matching required fields
      with compatible types. No downstream skill declares an input that no
      upstream skill produces.
    validation_method: policy-as-code
    status: checked
    evidence:
      - type: contract_chain_check
        source: "**/contract.yaml"
        captured_at: 2026-08-01T23:49:00.000Z
        checker: contract-compat-checker
        result_summary: >
          Chain review -> report compatible: report.input.required {findings, structure_overview}
          both satisfied by review.output.required {findings(array), structure_overview(string)},
          types match. review-expert output 'files_reviewed' (array) is now CONSUMED by
          report-expert as a declared optional input (array) rendered in a 'Files Reviewed'
          report section — the a001 unused-field advisory is RESOLVED. Worker source-reader-worker
          output {files, structure_overview} satisfies review-expert. 0 issues, 0 advisories.
        detail:
          field_mapping:
            "review-expert -> report-expert":
              findings: "findings -> findings (array -> array, compatible)"
              structure_overview: "structure_overview -> structure_overview (string -> string, compatible)"
              files_reviewed: "files_reviewed -> files_reviewed (array -> array, optional, now consumed)"
            "source-reader-worker -> review-expert":
              files: "files -> files (array -> array, compatible)"
              structure_overview: "structure_overview -> structure_overview (string -> string, compatible)"
    exceptions: []
    renewal_trigger: >
      Any contract.yaml modified, or new skill added with a new contract.
    next_review_required_on: "**/contract.yaml:modified"
    owner: surgeon
    risk_tier: high

  - id: workflow_termination
    statement: >
