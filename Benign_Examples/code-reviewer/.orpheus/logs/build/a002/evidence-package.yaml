      terminates in a bounded number of batches; no cycles or dangling
      references exist.
    validation_method: proof
    status: proven
    evidence:
      - type: dag_snapshot
        source: registry.yaml
        hash: sha256:72851dd2bcb080815b3b16bdf2dc79675f47e2298be2d3bed7abb9b565541726
        captured_at: 2026-08-01T23:49:00.000Z
        checker: dag-validator
        result_summary: >
          2 jobs, 1 dependency edge. review (no deps) -> report (depends on review).
          No cycles, no dangling references, no orphaned jobs. Topologically sorts into
          2 batches: [review], [report]. Longest path: review -> report. is_valid=true.
    exceptions: []
    renewal_trigger: >
      Any dependency edge added, removed, or retargeted. Any change to
      orchestrator routing rules that could affect job chaining.
    next_review_required_on: "registry.yaml:modified OR orchestrator/SKILL.md:routing_changed"
    owner: surgeon
    risk_tier: critical

